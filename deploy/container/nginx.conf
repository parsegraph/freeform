worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    types {
        text/html html htm;
        text/css css;
        text/javascript js mjs;
        application/json json map parsegraph;
        text/plain txt lisp;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/webp webp;
        image/x-icon ico;
        font/woff woff;
        font/woff2 woff2;
    }
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;
        root /srv;
        charset utf-8;
        absolute_redirect off;

        # Workers have stable filenames, so revalidate them on every deployment.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = /freeform {
            return 308 /freeform/$is_args$args;
        }
        location = /freeform/ {
            try_files /freeform/index.html =404;
        }
        location /freeform/ {
            try_files $uri =404;
        }
        location / {
            return 404;
        }
        location ~ /\. {
            return 404;
        }
    }
}
